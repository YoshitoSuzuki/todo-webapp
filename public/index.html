<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/client/app.js"></script>
</head>
<body>
  <main>
    <h1>ToDo</h1>
    <form id="new-form">
      <input id="new-title" placeholder="やること" autocomplete="off" required>
      <button type="submit">追加</button>
    </form>
    <p id="error" class="error" hidden></p>
    <ul id="list"></ul>
    <footer>
      <span id="count"></span>
      <div class="filters">
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="done">完了</button>
      </div>
      <button type="button" id="clear-done" class="link" hidden>完了を消す</button>
    </footer>
  </main>
</body>
</html>
